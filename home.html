<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Teko:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="home.css">
    <title>Application of TODO</title>
</head>

<body>

    <div class="title py-2">
        <h1>TOD</h1>

        <p class="pt-2">
            <?xml version="1.0" encoding="utf-8"?>
            <!-- License: MIT. Made by xivapi: https://github.com/xivapi/classjob-icons -->
            <svg fill="#dd2121" width="40px" height="40px" viewBox="-5 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M250 60q-54 0-100 27t-73 73-27 100 27 100 73 73 100 27 100-27 73-73 27-100-27-100-73-73-100-27zm-25 309L116 264l36-47 71 85 137-139 36 49z" />
            </svg>

        </p>
    </div>

    <div class="grid">
        <div class="container">
            <div class="personal-and-professional text-center">
                <div class="personal">
                    <button class="btn-grid" onclick="toggleBlocks('block1')"><h2>Personal</h2></button>
                </div>
                <div class="professional text-center">
                  <button class="btn-grid" onclick="toggleBlocks('block2')"><h2>Professional</h2></button>
                </div>
            </div>
        </div>
    </div>


    <div class="showcase pb-2"  id="block1" class="block">
        <div class="container">
            <div class="input-content py-5">
                <input type="text" id="taskInput" placeholder="What do you need to do...">
                <button id="addTaskBtn" class="add">ADD</button>

            </div>

            <div class="content">
                <p id="taskList"></p>
                <button id="deleteAllBtn" class="delete">🗑 Clear All</button>
            </div>
        </div>
    
    </div>

    <!--professional-->
    <div class="showcase pb-2"  id="block2" class="block hidden">
        <div class="container">
            <div class="input-content py-5">
                <input type="text" id="taskInput2" placeholder="What do you need to do...">
                <button id="addTaskBtn2" class="add">ADD</button>

            </div>

            <div class="content">
                <p id="taskList2"></p>
                <button id="deleteAllBtn2" class=" delete">🗑 Clear All</button>
            </div>
        </div>
    </div>


    <script src="home.js"></script>
</body>

</html>
